<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BO / MBIS / MWIS 學習地圖</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#18304c;background:#f4f7fb}body{margin:0}header{background:#102e51;color:white;padding:24px 18px}main{max-width:860px;margin:auto;padding:16px}h1{font-size:25px;margin:0}h2{font-size:20px}.sub{color:#64748b;font-size:14px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0}button{border:1px solid #cbd5e1;border-radius:11px;background:white;padding:11px 13px;font:inherit;cursor:pointer}button.on{background:#155eaa;color:white}.card{background:white;border:1px solid #e0e7f0;border-radius:14px;padding:17px;margin:12px 0;box-shadow:0 2px 9px #1534500c}.node{cursor:pointer}.arrow{text-align:center;color:#7890aa}.hidden{display:none}.detail-float{position:fixed;z-index:9999;right:16px;bottom:20px;width:min(380px,calc(100vw - 32px));max-height:min(65dvh,560px);overflow-y:auto;margin:0;box-sizing:border-box;border:1px solid #cbd5e1;box-shadow:0 18px 60px #0f172a40;background:white}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.detail-head button{padding:5px 10px;flex-shrink:0}.detail-float p{line-height:1.65}@media(max-width:600px){.detail-float{left:12px;right:12px;bottom:12px;width:auto;max-height:55dvh}}.explain{background:#eaf3ff;padding:12px;border-radius:10px;margin-top:10px}.tag{background:#e7f0fc;border-radius:7px;padding:4px 8px;font-size:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}footer{color:#64748b;text-align:center;font-size:12px;padding:30px}a{color:#1765b5}</style><header><div style="max-width:860px;margin:auto"><h1>🏛️ BO 學習地圖</h1><p>BD SE Interview · MBIS / MWIS · 法例架構與流程</p></div></header><main><nav class="tabs"><button class="on" onclick="tab('map',this)">BO 架構</button><button onclick="tab('flow',this)">流程圖</button><button onclick="tab('law',this)">條文解釋</button><button onclick="tab('quiz',this)">面試測驗</button></nav><section id="map"><h2>先認識四層架構</h2><p class="sub">點擊每層，理解佢喺整個制度負責乜。</p><div id="mapnodes"></div></section><section id="flow" class="hidden"><h2>MBIS / MWIS 流程</h2><div class="tabs"><button class="on" onclick="scheme('MBIS',this)">MBIS 驗樓</button><button onclick="scheme('MWIS',this)">MWIS 驗窗</button></div><div class="card" id="intro"></div><div id="steps"></div></section><section id="law" class="hidden"><h2>法例層級速查</h2><div id="laws"></div></section><section id="quiz" class="hidden"><h2>情境題</h2><div class="card"><strong id="q"></strong><div id="opts"></div><div id="feedback"></div><button onclick="next()">下一題 →</button></div><div class="card"><b>同一問題，兩種答法</b><div class="tabs"><button onclick="role(0)">BD Officer</button><button onclick="role(1)">普通市民</button></div><div class="explain" id="script">揀一種答法。</div></div></section><div id="detail" class="card detail-float hidden" role="dialog" aria-modal="false" aria-label="法例及流程解釋" aria-live="polite"></div><footer>教育用途 Demo，並非法律意見。正式處理個案前須核對現行法例、BD 官方 Code of Practice 及個別通知內容。</footer></main><script>const $=id=>document.getElementById(id);function tab(id,b){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('detail').classList.add('hidden')}function detail(t,d){const el=$('detail');el.classList.remove('hidden');el.innerHTML='<div class="detail-head"><b></b><button type="button" onclick="closeDetail()" aria-label="關閉解釋">✕</button></div><div class="detail-body"></div>';el.querySelector('b').textContent=t;el.querySelector('.detail-body').innerHTML=d}function closeDetail(){$('detail').classList.add('hidden')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});const layers=[['Cap.123 — Buildings Ordinance','法律主幹','BO 規定建築工程監管、樓宇安全責任，以及建築事務監督可採取嘅法定行動。'],['Subsidiary Regulations','附屬法例','例如 Cap.123P 對法定檢驗與維修程序作進一步規定。'],['Codes of Practice / PNAP','實務守則與指引','Code of Practice 交代技術及實務要求；PNAP 提供行政及技術指引。兩者法律地位不能一概等同條例。'],['Buildings Department','執行與監管','BD 審批及監察新建工程，亦負責現有樓宇安全、法定通知及執法。']];$('mapnodes').innerHTML=layers.map((x,i)=>'<div class="card node" onclick="layer('+i+')"><b>'+(i+1)+'. '+x[0]+'</b><p class="sub">'+x[1]+' · 按此解釋</p></div>'+(i<3?'<div class="arrow">↓</div>':'')).join('');function layer(i){detail(layers[i][0],layers[i][2])}let current='MBIS';const steps=['BD 選擇樓宇及發出法定通知','業主委任合資格人士','進行法定檢驗','判斷有冇所需維修','如有需要，委任合資格承建商','提交規定文件，BD 監察及跟進'];const explanations=['符合樓齡條件唔代表自動要驗；法定通知係重要起點。','MBIS 由 Registered Inspector (RI) 負責；MWIS 由 Qualified Person (QP) 負責。','依照適用 Code of Practice 檢查規定範圍，記錄安全問題。','即使冇維修需要，亦要按適用要求提交檢驗文件。','由合資格承建商進行所需維修，並按規定監督及核證。','BD 可審閱文件、抽查及對不遵從通知個案採取跟進。'];function scheme(s,b){current=s;document.querySelectorAll('#flow .tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('intro').innerHTML='<b>'+s+'</b><p>'+(s==='MBIS'?'一般樓齡達30年嘅合資格樓宇，重點係樓宇安全；由 RI 負責法定檢驗。':'一般樓齡達10年嘅合資格樓宇，重點係窗戶安全；由 QP 負責法定檢驗。')+'</p><span class="tag">收到法定通知後按通知要求履行責任</span>';$('steps').innerHTML=steps.map((x,i)=>'<div class="card node" onclick="detail(\''+s+' 第 '+(i+1)+' 步\',explanations['+i+'])"><b>'+(i+1)+'. '+x+'</b><p class="sub">按此睇背後原理</p></div>'+(i<5?'<div class="arrow">↓</div>':'')).join('')}scheme('MBIS',document.querySelector('#flow .tabs button'));const laws=[['Cap.123 s.30B','MBIS 法定通知','提供強制驗樓計劃相關法定權力。','將舊樓安全由出事後處理，推向定期預防性檢驗。'],['Cap.123 s.30C','MWIS 法定通知','提供強制驗窗計劃相關法定權力。','針對窗戶墮下風險設立較聚焦嘅制度。'],['Cap.123P','Building (Inspection and Repair) Regulation','詳細規定檢驗、維修及程序要求。','主法例講權力，附屬法例講執行細節。'],['Cap.123 s.40','Offences','涵蓋多類違反 BO 嘅罪行及罰則，須核對具體適用款項。','法定通知唔係普通建議，違反可能帶來法律後果。']];$('laws').innerHTML=laws.map((x,i)=>'<div class="card node" onclick="law('+i+')"><b>'+x[0]+'</b><p class="sub">'+x[1]+' · 按此展開</p></div>').join('');function law(i){let x=laws[i];detail(x[0]+' · '+x[1],'<b>條文作用：</b>'+x[2]+'<p><b>背後原理：</b>'+x[3]+'</p><p><a target="_blank" rel="noopener" href="https://www.elegislation.gov.hk/hk/cap123">官方法例原文</a></p>')}const qs=[['一棟35年樓齡嘅樓，係咪自動一定要做 MBIS？',['係，滿30年就即刻要做','唔係，仲要視乎適用條件及法定通知'],1,'樓齡係門檻之一，但唔係自動觸發法定檢驗。'],['MWIS 法定驗窗由邊類人士負責？',['Qualified Person','任何維修師傅都得'],0,'MWIS 要由符合資格嘅 QP 負責。'],['檢驗後發現問題，下一步通常係？',['安排所需維修並提交文件','只交報告，唔使理'],0,'檢驗係發現問題，維修先係消除風險。']];let qi=0;function render(){let x=qs[qi];$('q').textContent=(qi+1)+' / '+qs.length+'　'+x[0];$('opts').innerHTML=x[1].map((a,i)=>'<p><button onclick="check('+i+')">'+a+'</button></p>').join('');$('feedback').innerHTML=''}function check(i){let x=qs[qi];$('feedback').innerHTML='<div class="explain">'+(i===x[2]?'✅ 答啱！':'❌ 正確答案：'+x[1][x[2]]+'。')+' '+x[3]+'</div>'}function next(){qi=(qi+1)%qs.length;render()}function role(i){$('script').textContent=i===0?'MBIS 與 MWIS 屬預防性、風險為本嘅監管制度。透過法定通知要求業主委任 RI 或 QP 檢驗及安排所需維修，BD 負責監察、抽查與依法跟進。':'就好似舊樓定期做身體檢查。政府唔想等到石屎或者窗跌落街先處理，所以要求收到通知嘅業主搵合資格人士檢查，有問題就修理。'}render();</script></html>
